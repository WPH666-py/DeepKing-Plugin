<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepKing AI 助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="errBanner" class="dk-banner" style="display:none"></div>
  <div id="app">
    <header class="dk-header">
      <div class="dk-title">
        <img src="deepking.png" class="dk-logo" alt="DK">
        <span>DeepKing · AI 助手 <small id="verTag" style="opacity:.5">v0.1.10</small></span>
      </div>
      <div class="dk-header-actions">
        <select id="mode" title="模式"></select>
        <button id="btnClear" title="清空对话">🗑</button>
      </div>
    </header>

    <details id="settingsBar" class="dk-settings-bar" open>
      <summary>DeepSeek 配置</summary>
      <div class="dk-switches">
        <label class="dk-switch"><input type="checkbox" id="swTools" checked> 工具（Agent Loop）</label>
        <label class="dk-switch"><input type="checkbox" id="swMax" checked> max（最大能力模式）</label>
        <label class="dk-switch"><input type="checkbox" id="swMM" checked> 多模态（识图）</label>
      </div>
      <label>API Key<input id="setKey" type="password" placeholder="sk-..." autocomplete="off"></label>
      <label>Base URL<input id="setBase" placeholder="https://api.deepseek.com"></label>
      <label>模型<input id="setModel" placeholder="deepseek-chat"></label>
      <div class="dk-hint-inline">Agent（工具）模式建议 <code>deepseek-v4-pro</code> 或 <code>deepseek-chat</code>（已验证支持 Tool Calls；flash 可能不支持函数调用）</div>
      <label>工作目录<input id="setWorkdir" placeholder="留空 = 当前工程/当前目录"></label>
      <div id="visionSection">
        <div class="dk-vision-head">视觉识别（ModLens / DeepSeek-OCR）</div>
        <label>引擎<select id="visionProvider">
          <option value="modlens">ModLens（截图/语义/结构化）</option>
          <option value="deepseek-ocr">DeepSeek-OCR（文档/公式/表格）</option>
        </select></label>
        <label>Vision API Key<input id="visionKey" type="password" placeholder="sk-..." autocomplete="off"></label>
        <label>Vision Base URL<input id="visionBase" placeholder="https://api.openai.com/v1"></label>
        <label>Vision Model<input id="visionModel" placeholder="gpt-4o-mini / glm-4v-plus / deepseek-v4-flash-vision-exp"></label>
      </div>
    </details>

    <div id="messages" class="dk-messages">
      <div class="dk-empty" id="emptyTip">
        <div class="dk-empty-icon">🐳</div>
        <div>输入问题开始对话（可 Ctrl+V 粘贴图片）。<br>工作目录：<b id="workdirLabel">-</b></div>
      </div>
    </div>

    <footer class="dk-input-area">
      <div class="dk-progress" id="progress" style="display:none"></div>
      <div class="dk-paste-chip" id="pasteChip" style="display:none">
        <img id="pastePreview" alt="粘贴图片"><span id="pasteName"></span><button id="pasteRemove" title="移除">×</button>
      </div>
      <textarea id="input" rows="3" placeholder="输入您的问题…（Enter 发送，Shift+Enter 换行；可直接粘贴图片）"></textarea>
      <div class="dk-input-row">
        <span class="dk-hint" id="ctxHint">📎 粘贴图片即多模态提问</span>
        <button id="btnSend" class="dk-send" disabled>发送</button>
      </div>
    </footer>
  </div>

  <script src="chat.js"></script>
</body>
</html>
